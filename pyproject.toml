[project]
name = "content-studio"
version = "0.1.0"
description = "Tools behind the content-studio Claude Code plugin (command: cs)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.4; python_version >= '3.12'",
    "numpy==2.4.6; python_version < '3.12'",
    "faster-whisper==1.2.1",
]

[project.scripts]
cs = "content_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_studio"]
# vendored data files ship inside the package
include = ["src/content_studio/**/*.py", "src/content_studio/vendor/slop.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
